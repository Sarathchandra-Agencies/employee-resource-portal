<!doctype html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Warranty Repair Payment Voucher</title><style>:root{ --ink: #000000; --line: #000000; --paper: #ffffff; --bg: #d9d9d9;} *{ box-sizing: border-box;} @font-face{ font-family: "Google Sans"; font-style: normal; font-weight: 400; src: url("../../assets/fonts/google-sans/static/GoogleSans-Regular.ttf") format("truetype");} body{ margin: 0; padding: 30px 16px; background: var(--bg); font-family: "Google Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--ink); display: flex; flex-direction: column; justify-content: center; align-items: center;} .toolbar{ max-width: 900px; width: 100%; margin: 0 auto 12px; display: flex; gap: 10px; justify-content: flex-end;} button{ font-family: inherit; font-size: 0.78rem; padding: 7px 14px; border: 1px solid #000; background: var(--paper); cursor: pointer;} button:hover{ background: #000; color: #fff;} .sheet{ width: 100%; max-width: 900px; background: var(--paper); border: 1.5px solid var(--line); padding: 22px 26px 18px;} h1{ text-align: center; font-size: 1.45rem; font-weight: 800; letter-spacing: 0.02em; margin: 2px 0 18px;} .voucher-meta{ display: flex; justify-content: space-between; gap: 24px; margin-bottom: 14px; font-size: 0.88rem;} .plain-field{ display: flex; align-items: baseline; gap: 6px;} .plain-field label{ font-weight: normal; white-space: nowrap;} .plain-field input{ border: none; border-bottom: 1px solid #000; background: transparent; font-family: inherit; font-size: 0.88rem; padding: 2px 4px; min-width: 140px; flex: 1;} .plain-field input:focus{ outline: none; background: #f5f5e8;} .box{ border: 1px solid var(--line); margin-bottom: 14px;} .box-title{ font-weight: 800; font-size: 0.88rem; padding: 6px 10px; } .box-body{ padding: 10px 14px 12px;} .row{ display: grid; grid-template-columns: 1fr 1fr; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 30px;} .row >div, .row .kv{ min-width: 0;} .row .kv input{ width: 0; max-width: 100%;} .kv{ display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; font-size: 0.85rem;} .kv label{ min-width: 150px; white-space: nowrap;} .kv .colon{ padding-right: 2px;} .kv input, .kv input[type="date"]{ flex: 1; border: none; border-bottom: 1px dotted #000; background: transparent; font-family: inherit; font-size: 0.85rem; padding: 2px 4px; min-width: 0;} .kv input:focus{ outline: none; background: #f5f5e8; border-bottom: 1px solid #000;} .divider{ border: none; border-top: 1px solid var(--line); margin: 6px 0 12px;} table{ width: 100%; border-collapse: collapse; font-size: 0.85rem;} #costTable tr >:first-child{ border-left: 0;} #costTable tr >:last-child{ border-right: 0;} .table-title{ display: flex; justify-content: space-between; align-items: center;} th, td{ border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: middle;} tr:last-child>td{ border-bottom: 0;} th{ font-weight: 800; text-align: center; background: transparent;} th.desc-head{ text-align: left;} th.amt-head{ text-align: right;} td.no-col{ width: 34px; text-align: center;} td.amt-col{ width: 150px;} td.desc-cell{ position: relative; padding-right: 34px;} .remove-row{ position: absolute; top: 50%; right: 7px; width: 20px; height: 20px; padding: 0; border: 0; background: transparent; color: #777; font-size: 1rem; line-height: 20px; transform: translateY(-50%);} .remove-row:hover, .remove-row:focus-visible{ color: #a00; background: #fdd;} table input[type="text"], table input[type="number"]{ border: none; background: transparent; width: 100%; font-family: inherit; font-size: 0.85rem; padding: 2px 4px;} table input[type="number"]{ text-align: right;} table input:focus{ outline: none; background: #f5f5e8;} tfoot td{ font-weight: 800;} tfoot td.label-cell{ text-align: right;} #totalAmount{ text-align: right; padding-right: 10px;} .add-row-btn{ margin: 0px;} textarea{ width: 100%; height: 28px; min-height: 28px; resize: vertical; border: none; font-family: inherit; font-size: 0.85rem; padding: 2px 4px; line-height: 1.8; background-image: repeating-linear-gradient(to bottom, transparent, transparent 26px, #000 27px); background-attachment: local;} textarea:focus{ outline: none; background-color: #f5f5e8;} /* .sign-row{ display: flex; justify-content: space-between; gap: 40px; margin-top: 16px;} */ .sign-grid{ display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); width: 100%; margin-bottom: 12px; gap: 0px 50px;} .sign-cell{ padding: 10px 0px 0px 10px; min-width: 0; } .sign-cell .kv{ width: 100%; min-width: 0;} .sign-cell .sign-heading{ font-weight: 800; text-align: center; margin-bottom: 10px; font-size: 0.85rem;} .sign-cell .kv label{ min-width: 0; flex: 0 0 auto;} .sign-cell .kv input{ width: 0; min-width: 0; flex: 1 1 0;} @page{ size: A4 portrait; margin: 0;} @media print{ html, body{ width: 100%; margin: 0; background: var(--paper); padding: 0;} .toolbar{ display: none;} .sheet{ width: 100%; max-width: none; border: 0;} .no-print{ display: none !important;}} @media (max-width: 640px){ .row{ grid-template-columns: 1fr;} .letterhead{ flex-direction: column; gap: 10px;} .invoice-title{ font-size: 1.5rem;} .invoice-header-right{ width: 100%; align-items: flex-start;} .invoice-meta{ margin-top: 8px;} .kv label{ min-width: 120px; font-size: 0.78rem;} .sign-cell .kv label{ min-width: 120px; flex: 0 0 auto;} .sign-grid{ grid-template-columns: 1fr;} .sign-cell{ border-right: none;} .sign-cell:last-child{ border-bottom: none;} .payment-details-row .kv{ min-width: 0;}} </style></head><body><div class="toolbar"><button onclick="window.print()">Print / Save as PDF</button><button onclick="resetForm()">Clear Form</button></div><div class="sheet"><h1>WARRANTY REPAIR PAYMENT VOUCHER</h1><div class="voucher-meta"><div class="plain-field"><label for="voucherNo">Voucher No. :</label><input type="text" id="voucherNo" /></div><div class="plain-field"><label for="voucherDate">Date :</label><input type="date" id="voucherDate" /></div></div><div class="box"><div class="box-title">1. WARRANTY INFORMATION</div><div class="box-body"><div class="row"><div><div class="kv"><label for="warrantyCardNo">Warranty Card No.</label><span class="colon">:</span><input type="text" id="warrantyCardNo" /></div><div class="kv"><label for="jobNo">Job No.</label><span class="colon">:</span><input type="text" id="jobNo" /></div><div class="kv"><label for="productModel">Product Model</label><span class="colon">:</span><input type="text" id="productModel" /></div><div class="kv"><label for="serialNo">Serial No.</label><span class="colon">:</span><input type="text" id="serialNo" /></div></div><div><div class="kv"><label for="endUserName">End User Name</label><span class="colon">:</span><input type="text" id="endUserName" /></div><div class="kv"><label for="contactNo">Contact No.</label><span class="colon">:</span><input type="text" id="contactNo" /></div><div class="kv"><label for="locationAddress">Location / Address</label><span class="colon">:</span><input type="text" id="locationAddress" /></div></div></div><hr class="divider" /><div class="row"><div><div class="kv"><label for="technicianName">Technician Name</label><span class="colon">:</span><input type="text" id="technicianName" /></div><div class="kv"><label for="durationRepair">Duration of Repair</label><span class="colon">:</span><input type="text" id="durationRepair" /></div></div><div><div class="kv"><label for="dateCompleted">Date Repair Completed</label><span class="colon">:</span><input type="date" id="dateCompleted" /></div></div></div></div></div><div class="box"><div class="box-title table-title">2. COST BREAKDOWN <button class="add-row-btn no-print" onclick="addRow()">+ Add Line Item </button></div><div class="box-body" style="padding: 0"><table id="costTable"><thead><tr><th class="no-col">No.</th><th class="desc-head">Description</th><th class="amt-head">Amount (Rs.)</th></tr></thead><tbody><tr><td class="no-col">1</td><td class="desc-cell"><input type="text" class="desc-input" value="Technician Service Fee" /><button type="button" class="remove-row no-print" title="Remove item" aria-label="Remove item">&times;</button></td><td class="amt-col"><input type="number" class="amt-input" step="0.01" placeholder="0.00" /></td></tr><tr><td class="no-col">2</td><td class="desc-cell"><input type="text" class="desc-input" value="Travelling Charges" /><button type="button" class="remove-row no-print" title="Remove item" aria-label="Remove item">&times;</button></td><td class="amt-col"><input type="number" class="amt-input" step="0.01" placeholder="0.00" /></td></tr><tr><td class="no-col">3</td><td class="desc-cell"><input type="text" class="desc-input" value="Spare Parts (if any)" /><button type="button" class="remove-row no-print" title="Remove item" aria-label="Remove item">&times;</button></td><td class="amt-col"><input type="number" class="amt-input" step="0.01" placeholder="0.00" /></td></tr><tr><td class="no-col">4</td><td class="desc-cell"><input type="text" class="desc-input" value="Other Charges (if any)" /><button type="button" class="remove-row no-print" title="Remove item" aria-label="Remove item">&times;</button></td><td class="amt-col"><input type="number" class="amt-input" step="0.01" placeholder="0.00" /></td></tr><tr><td class="no-col">5</td><td class="desc-cell"><input type="text" class="desc-input" /><button type="button" class="remove-row no-print" title="Remove item" aria-label="Remove item">&times;</button></td><td class="amt-col"><input type="number" class="amt-input" step="0.01" placeholder="0.00" /></td></tr></tbody><tfoot><tr><td colspan="2" class="label-cell">TOTAL AMOUNT PAYABLE</td><td id="totalAmount">0.00</td></tr></tfoot></table></div></div><div class="box"><div class="box-title">3. REMARKS</div><div class="box-body"><textarea id="remarks"></textarea></div></div><div class="sign-grid"><div class="sign-cell"><div class="kv"><label for="preparedSign">Prepared By</label><span class="colon">:</span><input type="text" id="preparedSign" /></div></div><div class="sign-cell"><div class="kv"><label for="authorizedSign">Approved By</label><span class="colon">:</span><input type="text" id="authorizedSign" /></div></div></div></div><script>const tableBody=document.querySelector("#costTable tbody"); const totalCell=document.getElementById("totalAmount"); tableBody.addEventListener("click", (event)=>{ const removeButton=event.target.closest(".remove-row"); if (!removeButton) return; removeButton.closest("tr").remove(); renumber(); calcTotal();}); function renumber(){ [...tableBody.rows].forEach((row, i)=>{ row.querySelector(".no-col").textContent=i + 1;});} function calcTotal(){ let total=0; document.querySelectorAll(".amt-input").forEach((inp)=>{ const v=parseFloat(inp.value); if (!isNaN(v)) total +=v;}); totalCell.textContent=total.toFixed(2);} // function attachRowEvents(row){ // row.querySelector(".amt-input").addEventListener("input", calcTotal); // const removeBtn=row.querySelector(".remove-row"); // if (removeBtn){ // removeBtn.addEventListener("click", ()=>{ // row.remove(); // renumber(); // calcTotal(); //}); //} //} function attachRowEvents(row){ row.querySelector(".amt-input").addEventListener("input", calcTotal);} function addRow(){ const row=document.createElement("tr"); const idx=tableBody.rows.length + 1; row.innerHTML=` <td class="no-col">${idx}</td><td class="desc-cell"><input type="text" class="desc-input"><button type="button" class="remove-row no-print" title="Remove item" aria-label="Remove item">&times;</button></td><td class="amt-col"><input type="number" class="amt-input" step="0.01" placeholder="0.00"></td>`; tableBody.appendChild(row); attachRowEvents(row); renumber();} document.querySelectorAll(".amt-input").forEach((inp)=>{ inp.addEventListener("input", calcTotal);}); discountInput.addEventListener("input", calcTotal); function resetForm(){ if (!confirm("Clear all fields on this form?")) return; document .querySelectorAll( 'input[type="text"], input[type="date"], input[type="number"], textarea', ) .forEach((el)=>{ if (el.classList.contains("desc-input")) return; el.value="";}); document .querySelectorAll('input[type="radio"]') .forEach((el)=>(el.checked=false)); calcTotal();} calcTotal(); </script></body></html>
