<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warranty Repair Payment Voucher</title>

    <style>
      :root {
        --ink: #000000;
        --line: #000000;
        --paper: #ffffff;
        --bg: #d9d9d9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 30px 16px;
        background: var(--bg);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--ink);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .toolbar {
        max-width: 820px;
        width: 100%;
        margin: 0 auto 12px;
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }

      button {
        font-family: inherit;
        font-size: 0.78rem;
        padding: 7px 14px;
        border: 1px solid #000;
        background: var(--paper);
        cursor: pointer;
      }
      button:hover {
        background: #000;
        color: #fff;
      }

      .sheet {
        width: 100%;
        max-width: 820px;
        background: var(--paper);
        border: 1.5px solid var(--line);
        padding: 22px 26px 18px;
      }

      h1 {
        text-align: center;
        font-size: 1.45rem;
        font-weight: 800;
        letter-spacing: 0.02em;
        margin: 2px 0 18px;
      }

      .voucher-meta {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 14px;
        font-size: 0.88rem;
      }

      .plain-field {
        display: flex;
        align-items: baseline;
        gap: 6px;
      }

      .plain-field label {
        font-weight: normal;
        white-space: nowrap;
      }

      .plain-field input {
        border: none;
        border-bottom: 1px solid #000;
        background: transparent;
        font-family: inherit;
        font-size: 0.88rem;
        padding: 2px 4px;
        min-width: 140px;
        flex: 1;
      }

      .plain-field input:focus {
        outline: none;
        background: #f5f5e8;
      }

      .box {
        border: 1px solid var(--line);
        margin-bottom: 14px;
      }

      .box-title {
        font-weight: 800;
        font-size: 0.88rem;
        padding: 6px 10px;
        border-bottom: 1px solid var(--line);
      }

      .box-body {
        padding: 10px 14px 12px;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 30px;
      }

      .kv {
        display: flex;
        align-items: baseline;
        gap: 6px;
        margin-bottom: 8px;
        font-size: 0.85rem;
      }

      .kv label {
        min-width: 150px;
        white-space: nowrap;
      }

      .kv .colon {
        padding-right: 2px;
      }

      .kv input,
      .kv input[type="date"] {
        flex: 1;
        border: none;
        border-bottom: 1px dotted #000;
        background: transparent;
        font-family: inherit;
        font-size: 0.85rem;
        padding: 2px 4px;
        min-width: 0;
      }

      .kv input:focus {
        outline: none;
        background: #f5f5e8;
        border-bottom: 1px solid #000;
      }

      .divider {
        border: none;
        border-top: 1px solid var(--line);
        margin: 6px 0 12px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
      }

      th,
      td {
        border: 1px solid var(--line);
        padding: 6px 8px;
        text-align: left;
        vertical-align: middle;
      }

      th {
        font-weight: 800;
        text-align: center;
        background: transparent;
      }

      th.desc-head {
        text-align: left;
      }
      th.amt-head {
        text-align: right;
      }

      td.no-col {
        width: 34px;
        text-align: center;
      }

      td.amt-col {
        width: 150px;
      }

      table input[type="text"],
      table input[type="number"] {
        border: none;
        background: transparent;
        width: 100%;
        font-family: inherit;
        font-size: 0.85rem;
        padding: 2px 4px;
      }

      table input[type="number"] {
        text-align: right;
      }

      table input:focus {
        outline: none;
        background: #f5f5e8;
      }

      tfoot td {
        font-weight: 800;
      }

      tfoot td.label-cell {
        text-align: center;
      }

      #totalAmount {
        text-align: right;
        padding-right: 10px;
      }

      .remove-cell {
        width: 26px;
        text-align: center;
        border: none;
        padding: 0;
      }

      .remove-row {
        border: none;
        background: transparent;
        font-weight: 800;
        cursor: pointer;
        padding: 2px 4px;
        font-size: 0.9rem;
      }
      .remove-row:hover {
        color: #a00;
      }

      .add-row-btn {
        margin-top: 8px;
      }

      textarea {
        width: 100%;
        min-height: 80px;
        resize: vertical;
        border: none;
        font-family: inherit;
        font-size: 0.85rem;
        padding: 2px 4px;
        line-height: 1.8;
        background-image: repeating-linear-gradient(
          to bottom,
          transparent,
          transparent 26px,
          #000 27px
        );
        background-attachment: local;
      }

      textarea:focus {
        outline: none;
        background-color: #f5f5e8;
      }

      .sign-row {
        display: flex;
        justify-content: space-between;
        gap: 40px;
        margin-top: 16px;
      }

      @media print {
        body {
          background: var(--paper);
          padding: 0;
        }
        .toolbar {
          display: none;
        }
        .sheet {
          border: 1px solid #000;
        }
        .remove-row {
          display: none;
        }
      }

      @media (max-width: 640px) {
        .row {
          grid-template-columns: 1fr;
        }
        .voucher-meta {
          flex-direction: column;
        }
        .kv label {
          min-width: 120px;
          font-size: 0.78rem;
        }
        h1 {
          font-size: 1.15rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button onclick="window.print()">Print / Save as PDF</button>
      <button onclick="resetForm()">Clear Form</button>
    </div>

    <div class="sheet">
      <h1>WARRANTY REPAIR PAYMENT VOUCHER</h1>

      <div class="voucher-meta">
        <div class="plain-field">
          <label for="voucherNo">Voucher No. :</label>
          <input type="text" id="voucherNo" />
        </div>
        <div class="plain-field">
          <label for="voucherDate">Date :</label>
          <input type="date" id="voucherDate" />
        </div>
      </div>

      <div class="box">
        <div class="box-title">1. WARRANTY INFORMATION</div>
        <div class="box-body">
          <div class="row">
            <div>
              <div class="kv">
                <label for="warrantyCardNo"
                  >Warranty Card No.<span class="colon">:</span></label
                >
                <input type="text" id="warrantyCardNo" />
              </div>
              <div class="kv">
                <label for="jobNo">Job No.<span class="colon">:</span></label>
                <input type="text" id="jobNo" />
              </div>
              <div class="kv">
                <label for="productModel"
                  >Product Model<span class="colon">:</span></label
                >
                <input type="text" id="productModel" />
              </div>
              <div class="kv">
                <label for="serialNo"
                  >Serial No.<span class="colon">:</span></label
                >
                <input type="text" id="serialNo" />
              </div>
            </div>
            <div>
              <div class="kv">
                <label for="endUserName"
                  >End User Name<span class="colon">:</span></label
                >
                <input type="text" id="endUserName" />
              </div>
              <div class="kv">
                <label for="contactNo"
                  >Contact No.<span class="colon">:</span></label
                >
                <input type="text" id="contactNo" />
              </div>
              <div class="kv">
                <label for="locationAddress"
                  >Location / Address<span class="colon">:</span></label
                >
                <input type="text" id="locationAddress" />
              </div>
            </div>
          </div>

          <hr class="divider" />

          <div class="row">
            <div>
              <div class="kv">
                <label for="technicianName"
                  >Technician Name<span class="colon">:</span></label
                >
                <input type="text" id="technicianName" />
              </div>
              <div class="kv">
                <label for="durationRepair"
                  >Duration of Repair<span class="colon">:</span></label
                >
                <input type="text" id="durationRepair" />
              </div>
            </div>
            <div>
              <div class="kv">
                <label for="dateCompleted"
                  >Date Repair Completed<span class="colon">:</span></label
                >
                <input type="date" id="dateCompleted" />
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="box">
        <div class="box-title">2. COST BREAKDOWN</div>
        <div class="box-body" style="padding: 0">
          <table id="costTable">
            <thead>
              <tr>
                <th class="no-col">No.</th>
                <th class="desc-head">Description</th>
                <th class="amt-head">Amount (Rs.)</th>
                <th class="remove-cell"></th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="no-col">1</td>
                <td>
                  <input
                    type="text"
                    class="desc-input"
                    value="Technician Service Fee"
                  />
                </td>
                <td class="amt-col">
                  <input
                    type="number"
                    class="amt-input"
                    step="0.01"
                    placeholder="0.00"
                  />
                </td>
                <td class="remove-cell"></td>
              </tr>
              <tr>
                <td class="no-col">2</td>
                <td>
                  <input
                    type="text"
                    class="desc-input"
                    value="Travelling Charges"
                  />
                </td>
                <td class="amt-col">
                  <input
                    type="number"
                    class="amt-input"
                    step="0.01"
                    placeholder="0.00"
                  />
                </td>
                <td class="remove-cell"></td>
              </tr>
              <tr>
                <td class="no-col">3</td>
                <td>
                  <input
                    type="text"
                    class="desc-input"
                    value="Spare Parts (if any)"
                  />
                </td>
                <td class="amt-col">
                  <input
                    type="number"
                    class="amt-input"
                    step="0.01"
                    placeholder="0.00"
                  />
                </td>
                <td class="remove-cell"></td>
              </tr>
              <tr>
                <td class="no-col">4</td>
                <td>
                  <input
                    type="text"
                    class="desc-input"
                    value="Other Charges (if any)"
                  />
                </td>
                <td class="amt-col">
                  <input
                    type="number"
                    class="amt-input"
                    step="0.01"
                    placeholder="0.00"
                  />
                </td>
                <td class="remove-cell"></td>
              </tr>
              <tr>
                <td class="no-col">5</td>
                <td><input type="text" class="desc-input" /></td>
                <td class="amt-col">
                  <input
                    type="number"
                    class="amt-input"
                    step="0.01"
                    placeholder="0.00"
                  />
                </td>
                <td class="remove-cell"></td>
              </tr>
            </tbody>
            <tfoot>
              <tr>
                <td colspan="2" class="label-cell">TOTAL AMOUNT PAYABLE</td>
                <td id="totalAmount">0.00</td>
                <td class="remove-cell"></td>
              </tr>
            </tfoot>
          </table>
          <button
            class="add-row-btn"
            onclick="addRow()"
            style="margin: 8px 10px 10px"
          >
            + Add Line Item
          </button>
        </div>
      </div>

      <div class="box">
        <div class="box-title">3. REMARKS</div>
        <div class="box-body">
          <textarea id="remarks"></textarea>
        </div>
      </div>

      <div class="sign-row">
        <div class="plain-field">
          <label for="preparedBy">Prepared By :</label>
          <input type="text" id="preparedBy" />
        </div>
        <div class="plain-field">
          <label for="approvedBy">Approved By :</label>
          <input type="text" id="approvedBy" />
        </div>
      </div>
    </div>

    <script>
      const tableBody = document.querySelector("#costTable tbody");
      const totalCell = document.getElementById("totalAmount");

      function renumber() {
        [...tableBody.rows].forEach((row, i) => {
          row.querySelector(".no-col").textContent = i + 1;
        });
      }

      function calcTotal() {
        let total = 0;
        document.querySelectorAll(".amt-input").forEach((inp) => {
          const v = parseFloat(inp.value);
          if (!isNaN(v)) total += v;
        });
        totalCell.textContent = total.toFixed(2);
      }

      function attachRowEvents(row) {
        row.querySelector(".amt-input").addEventListener("input", calcTotal);
        const removeBtn = row.querySelector(".remove-row");
        if (removeBtn) {
          removeBtn.addEventListener("click", () => {
            row.remove();
            renumber();
            calcTotal();
          });
        }
      }

      function addRow() {
        const row = document.createElement("tr");
        const idx = tableBody.rows.length + 1;
        row.innerHTML = `
            <td class="no-col">${idx}</td>
            <td><input type="text" class="desc-input"></td>
            <td class="amt-col"><input type="number" class="amt-input" step="0.01" placeholder="0.00"></td>
            <td class="remove-cell"><button class="remove-row" title="Remove row">&times;</button></td>
        `;
        tableBody.appendChild(row);
        attachRowEvents(row);
        renumber();
      }

      document.querySelectorAll(".amt-input").forEach((inp) => {
        inp.addEventListener("input", calcTotal);
      });

      function resetForm() {
        if (!confirm("Clear all fields on this form?")) return;
        document
          .querySelectorAll(
            'input[type="text"], input[type="date"], input[type="number"], textarea',
          )
          .forEach((el) => {
            if (el.classList.contains("desc-input")) return;
            el.value = "";
          });
        calcTotal();
      }

      calcTotal();
    </script>
  </body>
</html>
